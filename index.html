<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#101825"/>
  <meta name="description" content="Mi Salud: organiza tus comidas, entrenamiento, hábitos y progreso como un RPG."/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <link rel="icon" href="./icons/icon-192.png"/>
  <link rel="stylesheet" href="./assets/styles.css"/>
  <title>Mi Salud · Tu aventura diaria</title>
</head>
<body>
  <div id="app"><div style="padding:50px;font:16px system-ui;color:#d8f4e9">Cargando Mi Salud…</div></div>
  <div id="modal"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    // Si la importación de módulos no llega a ejecutarse, ofrecer recuperación
    // sin tocar IndexedDB ni cachés con los datos personales.
    (function(){
      var fallback=function(){
        var app=document.getElementById('app');
        if(!app || !app.textContent || !app.textContent.includes('Cargando Mi Salud'))return;
        app.innerHTML='<div style="max-width:500px;margin:12vh auto;padding:24px;color:#e4f8eb;font-family:system-ui"><h1>Mi Salud no ha podido arrancar</h1><p>Puede que el navegador conserve archivos antiguos de la app. No borres los datos ni reinstales la aplicación.</p><p>Prueba a cerrar otras pestañas de Mi Salud y actualizar esta página.</p><button id="startup-hard-retry" style="padding:12px 18px;border:0;border-radius:12px;background:#57d4a3;color:#10251d;font-weight:bold">Volver a intentarlo</button></div>';
        var button=document.getElementById('startup-hard-retry');
        if(button)button.addEventListener('click',function(){location.reload();});
      };
      window.addEventListener('error',function(ev){
        if(ev.target instanceof HTMLScriptElement || (ev.message && /import|module/i.test(ev.message)))fallback();
      },true);
      window.addEventListener('unhandledrejection',fallback);
      setTimeout(fallback,10000);
    })();
  </script>
  <script type="module" src="./assets/main.js"></script>
</body>
</html>
